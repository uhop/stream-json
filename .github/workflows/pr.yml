name: Pull request checks
permissions:
  contents: read

on:
  pull_request:
    branches: ['master']

jobs:
  checks:
    name: Style and type checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: latest
      - run: npm ci
      - run: npm run build --if-present
      - run: npm run lint
      - run: npm run ts-check --if-present
      - run: npm run js-check --if-present
